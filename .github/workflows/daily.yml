name: Feed watch

on:
  schedule:
    - cron: "0 7 * * 1-5"   # weekdays, 07:00 UTC (GitHub schedules in UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: false

permissions:
  contents: write            # needed to commit state.json

concurrency:
  group: feed-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run the agent
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python src/main.py $DRY_RUN_FLAG

      - name: Save state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "feed-watch-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push
